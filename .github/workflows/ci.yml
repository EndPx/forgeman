name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: cargo build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Build
        run: cargo build --locked --quiet

      - name: Test
        run: cargo test --locked --quiet

      - name: Clippy
        run: cargo clippy --locked --quiet -- -D warnings
